<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>沖縄グルメMAP</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    body { margin:0; font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif; }
    #map { height: 100vh; width: 100%; background-color: #aadaff; /* 海の色に近い背景色を設定 */ }
    
    /* ▼ パステル地図のコントラストを上げる魔法のフィルター ▼ */
    .high-contrast-tiles {
      filter: contrast(1.15) saturate(1.3); /* くっきり＆鮮やかに */
    }

    /* ポップアップのデザイン */
    .leaflet-popup-content-wrapper { border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.2); }
    .popup-content { font-size: 14px; line-height: 1.5; color: #444; }
    
    .popup-img { width:100%; height:150px; border-radius: 8px; object-fit: cover; display:block; margin:8px 0; background-color: #eee; }
    
    .badge { display: inline-block; padding: 3px 8px; background-color: #ffab91; color: #fff; border-radius: 10px; font-size: 11px; margin-bottom: 5px; font-weight: bold; }
    
    .btn { 
      display:block; box-sizing: border-box; width: 100%; text-align: center;
      padding:10px; border:1px solid #ddd; background-color: #fff;
      border-radius:20px; text-decoration:none; margin-top: 8px; color: #555; font-size: 13px;
      transition: background 0.2s;
    }
    .btn:hover { background-color: #f5f5f5; }
    .btn-blue { background-color: #4fc3f7; color: white; border: none; font-weight: bold; }
    .btn-blue:hover { background-color: #29b6f6; }
    
    .small { font-size: 11px; color:#888; margin-top: 2px; }
    .shop-name { font-size: 16px; color: #333; margin-bottom: 2px; display: block; }

    /* ▼▼▼ アイコンの色分け ▼▼▼ */
    /* グルメ用（青→オレンジに変更） */
    img.img-food-icon {
      filter: hue-rotate(140deg) brightness(1.1); /* 青いピンをオレンジ系に変換 */
    }
    /* ランドマーク用（赤） */
    img.img-landmark-icon {
      filter: hue-rotate(0deg) saturate(1.5); /* そのままの青、または調整可。ここでは標準マーカーを使用 */
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    // CSV URL
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRVreCV1xOdZxTpGVS4qVRXnsF3KBeiM7otC6yE7hQWpkkz2l5YNbriQlRNtHan6hRKKwz65hvpnrUR/pub?output=csv";

    // ▼▼▼ 目印（ランドマーク）の設定 ▼▼▼
    // ここに追加すれば地図に表示されます
    const LANDMARKS = [
      { name: "🏰 首里城公園", lat: 26.2170, lng: 127.7195 },
      { name: "🐋 美ら海水族館", lat: 26.6943, lng: 127.8779 },
      { name: "🎡 アメリカンビレッジ", lat: 26.3168, lng: 127.7576 },
      { name: "✈️ 那覇空港", lat: 26.2048, lng: 127.6458 },
      { name: "🛍️ ウミカジテラス", lat: 26.1755, lng: 127.6433 }
    ];

    // --- 1. 地図タイル設定 ---
    
    // A. パステル改（コントラスト強化）
    const cartoVoyager = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '© OSM, © CARTO',
      className: 'high-contrast-tiles', // CSSでくっきりさせる
      maxZoom: 19
    });

    // B. ぼうけん地図（航空写真）
    const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles © Esri',
      maxZoom: 18
    });

    // C. 日本標準
    const gsiPale = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
      attribution: '国土地理院',
      maxZoom: 18
    });

    // --- 2. 地図初期化（最初はパステル） ---
    const map = L.map('map', {
      center: [26.2124, 127.6809],
      zoom: 10,
      layers: [cartoVoyager], 
      tap: false
    });

    // --- 3. 切り替えボタン（名称変更） ---
    const baseMaps = {
      "🧡 パステル (くっきり)": cartoVoyager,
      "🦖 ぼうけん地図 (航空写真)": esriSatellite,
      "💚 日本標準地図": gsiPale
    };
    L.control.layers(baseMaps).addTo(map);

    // --- 4. エリア制限 ---
    const OKINAWA_BOUNDS = L.latLngBounds([24.0, 122.3], [27.2, 131.4]);
    map.fitBounds(OKINAWA_BOUNDS);
    map.setMaxBounds(OKINAWA_BOUNDS);
    map.setMinZoom(8);
    map.setMaxZoom(19);

    let userMarker = null;

    // 現在地取得
    function getCurrentPosition() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) return reject(new Error("位置情報未対応"));
        navigator.geolocation.getCurrentPosition(
          pos => resolve([pos.coords.latitude, pos.coords.longitude]),
          err => reject(err),
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
        );
      });
    }

    async function ensureUserLocationOnMap() {
      try {
        const latlng = await getCurrentPosition();
        if (!userMarker) {
          userMarker = L.marker(latlng).addTo(map).bindPopup("現在地").openPopup();
        } else {
          userMarker.setLatLng(latlng);
        }
        return latlng;
      } catch (e) {
        throw e;
      }
    }

    function openGoogleDirections(originLatLng, destLatLng) {
      const [olat, olng] = originLatLng;
      const [dlat, dlng] = destLatLng;
      const url = `https://www.google.com/maps/dir/?api=1&origin=${olat},${olng}&destination=${dlat},${dlng}&travelmode=driving`;
      window.open(url, "_blank");
    }

    function safeNum(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    // ★ ランドマークを表示する関数 ★
    function addLandmarks() {
      // ランドマーク用の赤いアイコン設定
      // Leaflet標準のマーカー画像をCSSフィルターで赤く見せる
      const redIcon = new L.Icon({
        iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
        shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41],
        className: 'img-landmark-icon' // CSSで赤くするクラス
      });

      LANDMARKS.forEach(spot => {
        L.marker([spot.lat, spot.lng], { icon: redIcon })
          .addTo(map)
          .bindPopup(`<strong style="color:#d32f2f;">${spot.name}</strong>`);
      });
    }

    // CSV読み込み＆お店ピン立て
    function loadCsvAndRender() {
      const url = CSV_URL + (CSV_URL.includes("?") ? "&" : "?") + "_=" + Date.now();

      // お店用のオレンジアイコン設定
      const foodIcon = new L.Icon({
        iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
        shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41],
        className: 'img-food-icon' // CSSでオレンジにするクラス
      });

      Papa.parse(url, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: (results) => {
          const rows = results.data || [];

          rows.forEach(row => {
            const status = (row.status || "").trim().toLowerCase();
            if (status && status !== "active") return;

            const lat = safeNum(row.lat);
            const lng = safeNum(row.lng);
            if (lat === null || lng === null) return;

            const name = (row.name || "").trim() || "名称未設定";
            const address = (row.address || "").trim();
            const articleUrl = (row.article_url || "").trim();
            const imageUrl = (row.image_url || "").trim();
            const category = (row.category || "").trim();

            const marker = L.marker([lat, lng], { icon: foodIcon }).addTo(map);

            const div = document.createElement("div");
            div.className = "popup-content";

            if (imageUrl) {
              const img = document.createElement("img");
              img.src = imageUrl;
              img.alt = name;
              img.className = "popup-img";
              img.loading = "lazy";
              img.onerror = function() { this.style.display = 'none'; };
              div.appendChild(img);
            }

            const title = document.createElement("div");
            let titleHtml = "";
            if (category) {
              titleHtml += `<span class="badge">${category}</span><br>`;
            }
            titleHtml += `<strong class="shop-name">${name}</strong><div class="small">${address}</div>`;
            title.innerHTML = titleHtml;
            div.appendChild(title);

            if (articleUrl) {
              const a = document.createElement("a");
              a.className = "btn";
              a.href = articleUrl;
              a.target = "_blank";
              a.rel = "noopener";
              a.textContent = "詳細を見る";
              div.appendChild(a);
            }

            const b = document.createElement("a");
            b.className = "btn btn-blue";
            b.href = "#";
            b.textContent = "ここへ行く";
            b.addEventListener("click", async (e) => {
              e.preventDefault();
              const originalText = b.textContent;
              b.textContent = "取得中...";
              try {
                const origin = await ensureUserLocationOnMap();
                openGoogleDirections(origin, [lat, lng]);
                b.textContent = originalText;
              } catch (err) {
                alert("位置情報エラー");
                b.textContent = "エラー";
              }
            });
            div.appendChild(b);

            marker.bindPopup(div);
          });
        },
        error: () => alert("データ読込エラー")
      });
    }

    // 実行
    addLandmarks();      // 目印を追加
    loadCsvAndRender();  // お店を追加
  </script>
</body>
</html>
